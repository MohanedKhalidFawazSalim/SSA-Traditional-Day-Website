<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASTRA — Junior Astronaut Mission Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    :root {
      --bg-outer: #080a14;
      --ink: #1e1933;
      --ink-muted: #564d75;
      --win-bg: #f6f4ec;
      --win-card: #ffffff;
      --border-dark: #231c3d;
      --border-light: #d6cfbe;
      --accent: #e06a34;
      --btn-bg: #ffd466;
      --btn-hover: #ffe699;
      --good: #1a8247;
      --bad: #c43131;
      --warn: #bf7111;
      --info: #2563eb;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-outer);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Press Start 2P", ui-monospace, monospace;
    }

    /* Fixed 960x640 viewport scaled proportionally to fit any laptop/desktop screen */
    #stage {
      position: relative;
      width: 960px;
      height: 640px;
      flex: none;
      transform-origin: center center;
      background: #090b18;
      overflow: hidden;
      box-shadow: 0 0 0 4px #281e42, 0 24px 64px rgba(0, 0, 0, 0.85);
      color: var(--ink);
      font-size: 11px;
      line-height: 1.6;
    }

    canvas#gameCanvas {
      width: 960px;
      height: 640px;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .px-sprite {
      display: inline-block;
      vertical-align: middle;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      flex: none;
    }

    /* ===== PERSISTENT TOP RESOURCE HUD ===== */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 54px;
      display: none;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      background: rgba(16, 14, 32, 0.96);
      border-bottom: 4px solid #0c0a1a;
      color: #f6f4ec;
      font-size: 7.5px;
      z-index: 12;
    }

    .hud-cell {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid #392f5e;
      padding: 4px 5px;
    }

    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      white-space: nowrap;
    }

    .hud-label {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .hud-vals {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .hud-bar {
      height: 5px;
      background: #0c0a1a;
      border: 1px solid #000;
      margin-top: 3px;
      overflow: hidden;
    }

    .hud-bar > i {
      display: block;
      height: 100%;
      transition: width 0.2s steps(6);
    }

    .hud-day {
      flex: none;
      background: #251d40;
      border: 2px solid #ffd466;
      color: #ffd466;
      padding: 6px 8px;
      font-size: 8.5px;
      white-space: nowrap;
      text-align: center;
    }

    .hud-actions {
      display: flex;
      gap: 4px;
      flex: none;
    }

    .hud-btn {
      font-family: inherit;
      font-size: 7.5px;
      background: #ffd466;
      color: #1e1933;
      border: 2px solid #0c0a1a;
      padding: 6px 7px;
      cursor: pointer;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: #ffe699;
    }

    .hud-btn.sim {
      background: #4fd190;
    }

    .hud-btn.sim:hover {
      background: #7ef2b2;
    }

    .hud-warn {
      border-color: #ff5e5e;
      animation: hudBlink 0.75s steps(2) infinite;
    }

    @keyframes hudBlink {
      50% { opacity: 0.45; }
    }

    /* ===== OBJECTIVE SUB-BAR ===== */
    #objectiveBar {
      position: absolute;
      top: 54px;
      left: 0;
      right: 0;
      background: rgba(25, 22, 48, 0.9);
      border-bottom: 2px solid #392f5e;
      color: #dbeafe;
      font-size: 8px;
      padding: 4px 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 11;
    }

    /* ===== DEDICATED STATUS TOAST BANNER ===== */
    #toast {
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      background: #231c3d;
      color: #ffd466;
      border: 3px solid #ffd466;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.65);
      padding: 7px 14px;
      font-size: 9px;
      display: none;
      z-index: 26;
      white-space: nowrap;
    }

    /* ===== NEARBY INTERACTION PROMPT (CLICKABLE OR [ENTER]) ===== */
    #prompt {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--win-bg);
      color: var(--ink);
      border: 4px solid var(--border-dark);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.6);
      padding: 7px 14px;
      font-size: 10px;
      display: none;
      z-index: 15;
      white-space: nowrap;
      cursor: pointer;
    }

    #prompt:hover {
      background: var(--btn-hover);
    }

    /* ===== REUSABLE DIALOGUE BOX & CHOICES ===== */
    #dialogueBox {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 16px;
      min-height: 126px;
      background: var(--win-bg);
      border: 5px solid var(--border-dark);
      box-shadow: inset 0 0 0 3px var(--border-light), 6px 6px 0 rgba(0, 0, 0, 0.7);
      padding: 14px 18px 24px 18px;
      display: none;
      z-index: 22;
    }

    .dlg-layout {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .dlg-portrait {
      width: 58px;
      height: 58px;
      background: #1b1730;
      border: 3px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .dlg-body {
      flex: 1;
      min-width: 0;
    }

    .dlg-speaker {
      color: var(--accent);
      font-size: 10px;
      margin-bottom: 6px;
      display: block;
    }

    .dlg-text {
      color: var(--ink);
      font-size: 11px;
      line-height: 1.85;
      min-height: 40px;
    }

    .dlg-choices {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-btn {
      font-family: inherit;
      font-size: 9.5px;
      text-align: left;
      background: #ffffff;
      color: var(--ink);
      border: 3px solid var(--border-dark);
      padding: 7px 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border-dark);
    }

    .choice-btn:hover, .choice-btn.selected {
      background: var(--btn-bg);
    }

    .dlg-hint {
      position: absolute;
      right: 14px;
      bottom: 7px;
      font-size: 8px;
      color: var(--ink-muted);
    }

    /* ===== MODAL OVERLAYS & WINDOWS ===== */
    #modalLayer {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 30;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 20, 0.74);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .overlay.menu-overlay {
      background: transparent;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 42px;
    }

    .window {
      background: var(--win-bg);
      border: 5px solid var(--border-dark);
      box-shadow: inset 0 0 0 3px var(--border-light), 8px 8px 0 rgba(0, 0, 0, 0.75);
      padding: 16px 20px;
      width: 100%;
      max-width: 820px;
      max-height: 575px;
      overflow-y: auto;
      color: var(--ink);
    }

    .window.narrow {
      max-width: 530px;
    }

    .win-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px solid var(--border-light);
      padding-bottom: 9px;
      margin-bottom: 12px;
    }

    .win-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      margin: 0;
    }

    .status-pill {
      font-size: 8.5px;
      padding: 4px 8px;
      border: 2px solid var(--border-dark);
      background: #e4dfd0;
    }

    .status-pill.ready {
      background: #c7f2d6;
      color: #135e32;
    }

    .status-pill.growing {
      background: #fef08a;
      color: #854d0e;
    }

    .status-pill.offline {
      background: #fecaca;
      color: #991b1b;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 10px 0;
    }

    .panel-box {
      background: var(--win-card);
      border: 3px solid var(--border-dark);
      padding: 10px 12px;
    }

    .panel-box h3 {
      margin: 0 0 8px 0;
      font-size: 9.5px;
      color: var(--ink-muted);
      text-transform: uppercase;
    }

    .cost-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0;
      font-size: 9px;
    }

    .cost-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1ede2;
      border: 2px solid var(--border-dark);
      padding: 3px 6px;
    }

    .cost-tag.out {
      background: #d5f5e0;
    }

    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f8f7f2;
      border: 2px solid var(--border-dark);
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 9px;
    }

    .machine-quote {
      background: #ebe6d5;
      border-left: 4px solid var(--accent);
      padding: 8px 10px;
      font-size: 9.5px;
      margin: 10px 0;
      color: #32264d;
    }

    /* ===== PIXEL BUTTONS ===== */
    .btn {
      font-family: inherit;
      font-size: 10px;
      background: var(--btn-bg);
      color: var(--ink);
      border: 3px solid var(--border-dark);
      box-shadow: 3px 3px 0 var(--border-dark);
      padding: 8px 12px;
      margin: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.08s;
    }

    .btn:hover:not(:disabled) {
      background: var(--btn-hover);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-dark);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .btn.secondary {
      background: #e5dfd0;
    }

    .btn.secondary:hover:not(:disabled) {
      background: #f2ede0;
    }

    .btn.good {
      background: #5ce09b;
    }

    .btn.good:hover:not(:disabled) {
      background: #86f2b9;
    }

    .btn.danger {
      background: #f59b8e;
    }

    .btn.small {
      font-size: 8px;
      padding: 4px 7px;
      margin: 0;
      box-shadow: 2px 2px 0 var(--border-dark);
    }

    /* ===== MAIN MENU TITLE & STACK ===== */
    .game-logo {
      font-size: 52px;
      color: #ffd466;
      text-shadow: 4px 4px 0 #d95b26, 8px 8px 0 #141026;
      letter-spacing: 4px;
      margin: 0 0 8px 0;
      text-align: center;
    }

    .game-subtitle {
      font-size: 10px;
      color: #dbeafe;
      text-shadow: 2px 2px 0 #100c20;
      margin: 0 0 22px 0;
      text-align: center;
    }

    .menu-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .menu-stack .btn {
      width: 280px;
      font-size: 11px;
      padding: 11px 14px;
    }

    /* ===== SIMULATION PROGRESS BAR ===== */
    .sim-progress {
      height: 18px;
      background: #ffffff;
      border: 4px solid var(--border-dark);
      margin: 14px 0;
      padding: 2px;
    }

    .sim-progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s steps(10);
    }

    .delta-up { color: var(--good); }
    .delta-dn { color: var(--bad); }
    .msg-err {
      color: var(--bad);
      font-size: 9px;
      line-height: 1.6;
      min-height: 14px;
      margin: 6px 0;
    }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div id="hud"></div>
    <div id="objectiveBar"></div>
    <div id="toast"></div>
    <div id="prompt"></div>
    <div id="dialogueBox"></div>
    <div id="modalLayer"></div>
  </div>

  <script>
  "use strict";

  /* =========================================================================
   * UTILITY: Clean Floating-Point Formatter
   * Formats values like 15.14, 3.32, 2.25, or 120 cleanly without float noise.
   * ========================================================================= */
  function fmt(val) {
    const rounded = Math.round((Number(val) || 0) * 100) / 100;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(2).replace(/\.?0+$/, "");
  }

  /* =========================================================================
   * MODULE 1: CONFIG
   * Centralized gameplay assumptions, scientifically referenced baseline values,
   * action costs/outputs, crop rules, and daily lunar events.
   * ========================================================================= */
  const CONFIG = {
    projectTitle: "ASTRA",
    projectSubtitle: "JUNIOR ASTRONAUT MISSION TRAINER",
    totalDays: 7,

    // Starting & Maximum Resource Parameters (Section 5 & Section 10)
    resources: {
      water:     { name: "Water",          unit: "L",   start: 120, max: 200, color: "#38a3e8" },
      oxygen:    { name: "Oxygen",         unit: "kg",  start: 30,  max: 50,  color: "#4fd190" },
      food:      { name: "Food",           unit: "FP",  start: 100, max: 150, color: "#e67432" }, // 1 FP = 1,000 kcal
      power:     { name: "Power",          unit: "kWh", start: 120, max: 200, color: "#f2c230" },
      integrity: { name: "Base Integrity", unit: "%",   start: 100, max: 100, color: "#7a9ef5" },
      stamina:   { name: "Stamina",        unit: "%",   start: 100, max: 100, color: "#f25c78" }
    },

    // Greenhouse planting supplies (tracked inside Greenhouse UI, not in top HUD)
    initialSupplies: {
      seeds: 6,
      nutrients: 6
    },

    // Daily Crew Consumption for 4 Astronauts (Gameplay reference values)
    dailyCrewConsumption: {
      water: 15.14,  // L/day
      oxygen: 3.32,  // kg/day
      food: 12.14    // FP/day (1 FP = 1,000 kcal)
    },

    // Automatic Power Balance (Solar +25 kWh/day, Base -10 kWh/day => +15 kWh/day)
    powerSystem: {
      solarGeneration: 25,
      baseConsumption: 10
    },

    // Configurable depletion penalties when Water or Food reaches 0 during crew consumption
    depletionPenalties: {
      waterZeroStaminaPenalty: 15,
      foodZeroStaminaPenalty: 12
    },

    // Immediate Sustenance Actions (Section 6)
    sustenance: {
      eatFood: {
        id: "eatFood",
        name: "Eat Ration Pack",
        resource: "food",
        cost: 2,          // 2 FP
        staminaGain: 3    // +3% stamina immediately
      },
      drinkWater: {
        id: "drinkWater",
        name: "Drink Water",
        resource: "water",
        cost: 2,          // 2 L
        staminaGain: 3    // +3% stamina immediately
      }
    },

    // Queued Machine Actions (Section 7)
    actions: {
      recycleWater: {
        id: "recycleWater",
        name: "Water Recycling",
        machineName: "Water Recycling Machine",
        description: "Filters and distills cabin wastewater to recover clean potable water.",
        requiresPower: true,
        costs: { power: 3, stamina: 3 },
        outputText: "+10 L Water (available after simulation)",
        tutorialWhen: "Added to Water reserves after clicking SIMULATE / END DAY."
      },
      repairBase: {
        id: "repairBase",
        name: "Repair Equipment",
        machineName: "Base Integrity Console",
        description: "Reinforces hull seals, micrometeorite shielding, and life-support conduits.",
        requiresPower: true,
        costs: { power: 10, stamina: 20 },
        outputText: "+20% Base Integrity (max 100%, after simulation)",
        tutorialWhen: "Restores +20% Base Integrity after clicking SIMULATE / END DAY."
      },
      growFood: {
        id: "growFood",
        name: "Grow Food",
        machineName: "Hydroponic Greenhouse",
        description: "Plants lunar crop seedlings in nutrient-enriched mist. Takes 3 full days to mature.",
        requiresPower: true,
        costs: { water: 8, power: 8, stamina: 20, seeds: 1, nutrients: 1 },
        cropGrowthDays: 3,
        outputText: "Starts 3-day crop growth timer (no immediate FP)",
        tutorialWhen: "Matures after 3 completed in-game days, then requires Harvest Food."
      },
      harvestFood: {
        id: "harvestFood",
        name: "Harvest Food",
        machineName: "Hydroponic Greenhouse",
        description: "Harvests mature lunar crops into nutritious 1,000 kcal Food Points (FP).",
        requiresPower: false,
        costs: { stamina: 23 },
        outputText: "+15 FP Food (after simulation; resets bed to Empty)",
        tutorialWhen: "Available once a planted crop reaches Mature status."
      },
      generateOxygen: {
        id: "generateOxygen",
        name: "Generate Oxygen",
        machineName: "Oxygen Generator",
        description: "Splits purified water via electrolysis to replenish breathable cabin oxygen.",
        requiresPower: true,
        costs: { water: 2.25, power: 6, stamina: 3 },
        outputText: "+4 kg Oxygen (available after simulation)",
        tutorialWhen: "Added to Oxygen reserves after clicking SIMULATE / END DAY."
      }
    },

    // Configurable Daily Events (Days 1–7)
    dailyEvents: {
      1: {
        title: "Nominal Lunar Touchdown",
        description: "All lunar base telemetry settled cleanly after landing. No unexpected hazards.",
        effects: {}
      },
      2: {
        title: "Micrometeorite Dusting",
        description: "High-velocity lunar dust abraded outer thermal panels (-12% Base Integrity).",
        effects: { integrity: -12 }
      },
      3: {
        title: "Solar Flare Surge",
        description: "High solar irradiance boosted array output (+8 kWh Power), though radiation stressed seals (-5% Base Integrity).",
        effects: { power: 8, integrity: -5 }
      },
      4: {
        title: "Coolant Valve Frost",
        description: "Shadow temperature drop froze an auxiliary line (-4 L Water, -8% Base Integrity).",
        effects: { water: -4, integrity: -8 }
      },
      5: {
        title: "Subsurface Ice Pocket",
        description: "Thermal drill tapped a clean regolith ice seam (+8 L Water).",
        effects: { water: 8 }
      },
      6: {
        title: "Earthshine Shadow Pass",
        description: "Low-angle ridge shadow reduced solar collection (-10 kWh Power) and chilled hull joints (-10% Base Integrity).",
        effects: { power: -10, integrity: -10 }
      },
      7: {
        title: "Final Ascent Window Prep",
        description: "Orbital rendezvous beacon active! Maintain all life-support systems through the final night (-10% Base Integrity).",
        effects: { integrity: -10 }
      }
    }
  };


  /* =========================================================================
   * MODULE 2: GameState & Persistence
   * Centralized state supporting Opening Story, Day 0 Tutorial, Days 1–7,
   * immediate cost reservation, pending action queues, and 2 crop grow beds.
   * ========================================================================= */
  const GameState = (() => {
    const STORAGE_KEY = "ASTRA_SAVE_V1";

    function createInitial() {
      return {
        phase: "story_classroom", // "story_classroom" | "story_bedroom" | "day0" | "survival" | "gameover" | "victory"
        day: 0,
        room: "classroom",
        x: 150,
        y: 190,
        facing: "right",
        outfit: "kid",            // "kid" in classroom/bedroom, "suit" in spacecraft & lunar base

        // Story & Day 0 Tutorial flags
        storyFlags: {
          classroomTalkDone: false,
          wokeUpInSpace: false,
          talkedNova: false,
          talkedEngineer: false,
          talkedScientist: false,
          inspectedMachines: {}   // { water: true, oxygen: true, repair: true, greenhouse: true, galley: true }
        },

        // Core Resource Parameters
        res: {
          water: CONFIG.resources.water.start,
          oxygen: CONFIG.resources.oxygen.start,
          food: CONFIG.resources.food.start,
          power: CONFIG.resources.power.start,
          integrity: CONFIG.resources.integrity.start,
          stamina: CONFIG.resources.stamina.start
        },

        // Greenhouse Supplies
        supplies: {
          seeds: CONFIG.initialSupplies.seeds,
          nutrients: CONFIG.initialSupplies.nutrients
        },

        // Two Hydroponic Grow Beds: status = "Empty" | "Growing" | "Mature"
        cropBeds: [
          { id: 0, name: "Grow Bed A", status: "Empty", remainingDays: 0 },
          { id: 1, name: "Grow Bed B", status: "Empty", remainingDays: 0 }
        ],

        // Queued actions for the current day (costs already deducted/reserved!)
        pendingQueue: [],
        lastReport: null
      };
    }

    let current = createInitial();

    return {
      get: () => current,
      reset: () => {
        current = createInitial();
        return current;
      },
      replace: (loaded) => {
        current = loaded;
        return current;
      },
      save: () => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(current));
          return true;
        } catch (e) {
          return false;
        }
      },
      load: () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const d = JSON.parse(raw);
          if (!d || typeof d !== "object" || !d.res || !RoomDefinitions[d.room]) return null;
          for (const k of Object.keys(CONFIG.resources)) {
            if (typeof d.res[k] !== "number" || Number.isNaN(d.res[k])) return null;
          }
          d.pendingQueue = Array.isArray(d.pendingQueue) ? d.pendingQueue : [];
          d.cropBeds = Array.isArray(d.cropBeds) && d.cropBeds.length === 2
            ? d.cropBeds
            : createInitial().cropBeds;
          d.supplies = d.supplies || { ...CONFIG.initialSupplies };
          d.storyFlags = d.storyFlags || createInitial().storyFlags;
          d.storyFlags.inspectedMachines = d.storyFlags.inspectedMachines || {};
          d.outfit = d.outfit || (d.phase === "story_classroom" || d.phase === "story_bedroom" ? "kid" : "suit");
          return d;
        } catch (e) {
          return null;
        }
      },
      hasSave() {
        return this.load() !== null;
      }
    };
  })();


  /* =========================================================================
   * MODULE 3: GameLogicService
   * Strictly implements:
   * - Day 0 Safe Tutorial Rules (zero consumption, zero failure)
   * - Immediate Sustenance (Eat Food, Drink Water)
   * - Queued Action Validation, Immediate Cost Reservation & Refund Cancellation
   * - 7-Step End-of-Day Simulation & Survival Validation
   * ========================================================================= */
  const GameLogicService = {
    clamp(val, min, max) {
      return Math.round(Math.max(min, Math.min(max, val)) * 100) / 100;
    },

    isDay0Complete(state) {
      const f = state.storyFlags;
      const machCount = Object.keys(f.inspectedMachines || {}).length;
      return Boolean(f.talkedNova && f.talkedEngineer && f.talkedScientist && machCount >= 3);
    },

    /* Immediate Sustenance: Eat Food (-2 FP -> +3% Stamina) or Drink Water (-2 L -> +3% Stamina) */
    consumeSustenance(state, type) {
      if (state.phase === "day0") {
        return {
          ok: true,
          message: "Day 0 Tutorial: In survival mode, this consumes 2 units and restores +3% Stamina immediately!"
        };
      }

      const spec = CONFIG.sustenance[type];
      if (!spec) return { ok: false, message: "Unknown sustenance action." };

      if (state.res.stamina >= 100) {
        return { ok: false, message: "Stamina is already at 100%!" };
      }

      const avail = state.res[spec.resource];
      if (avail < spec.cost) {
        const resInfo = CONFIG.resources[spec.resource];
        const missing = fmt(spec.cost - avail);
        return {
          ok: false,
          message: `Insufficient ${resInfo.name} — Required: ${spec.cost} ${resInfo.unit}, Available: ${fmt(avail)} ${resInfo.unit} (Need ${missing} more ${resInfo.unit}).`
        };
      }

      state.res[spec.resource] = this.clamp(avail - spec.cost, 0, CONFIG.resources[spec.resource].max);
      state.res.stamina = this.clamp(state.res.stamina + spec.staminaGain, 0, 100);
      return {
        ok: true,
        message: `${spec.name}: -${spec.cost} ${CONFIG.resources[spec.resource].unit} -> +${spec.staminaGain}% Stamina (Now ${fmt(state.res.stamina)}%).`
      };
    },

    /* Validate & Queue an Action: Immediately reserves/deducts costs, produces nothing until SIMULATE */
    queueAction(state, actionId, bedIndex = null) {
      if (state.phase === "day0") {
        return {
          ok: false,
          message: "Day 0 Tutorial Mode: Actions cannot be queued until landing on the Moon (Day 1)."
        };
      }

      const spec = CONFIG.actions[actionId];
      if (!spec) return { ok: false, message: "Invalid action." };

      // Check Power = 0 rule for powered machines
      if (spec.requiresPower && state.res.power <= 0) {
        return {
          ok: false,
          message: "Power Offline (0 kWh) — Powered machines cannot operate until solar power recharges."
        };
      }

      // Greenhouse bed-specific validation
      if (actionId === "growFood") {
        const bed = state.cropBeds[bedIndex];
        if (!bed || bed.status !== "Empty") {
          return { ok: false, message: "This grow bed already has an active crop." };
        }
        const alreadyQueued = state.pendingQueue.some((q) => q.actionId === "growFood" && q.bedIndex === bedIndex);
        if (alreadyQueued) {
          return { ok: false, message: `${bed.name} already has a planting action queued today.` };
        }
      }

      if (actionId === "harvestFood") {
        const bed = state.cropBeds[bedIndex];
        if (!bed || bed.status !== "Mature") {
          return { ok: false, message: "Crop is not mature yet. Crops require 3 completed days before harvesting." };
        }
        const alreadyQueued = state.pendingQueue.some((q) => q.actionId === "harvestFood" && q.bedIndex === bedIndex);
        if (alreadyQueued) {
          return { ok: false, message: `${bed.name} is already queued for harvest today.` };
        }
      }

      // Validate exact resource & stamina requirements
      const missingList = [];
      for (const [key, req] of Object.entries(spec.costs)) {
        if (key === "seeds" || key === "nutrients") {
          const avail = state.supplies[key];
          if (avail < req) {
            const label = key === "seeds" ? "Seeds" : "Nutrient Packs";
            missingList.push(`Insufficient ${label} — Required: ${req}, Available: ${avail} (Need ${req - avail} more).`);
          }
        } else {
          const avail = state.res[key];
          if (avail < req) {
            const info = CONFIG.resources[key];
            const diff = fmt(req - avail);
            if (key === "stamina") {
              missingList.push(`Insufficient Stamina — Required: ${req}%, Available: ${fmt(avail)}% (Eat Food or Drink Water to recover stamina).`);
            } else {
              missingList.push(`Insufficient ${info.name} — Required: ${fmt(req)} ${info.unit}, Available: ${fmt(avail)} ${info.unit} (You need ${diff} more ${info.unit}).`);
            }
          }
        }
      }

      if (missingList.length > 0) {
        return { ok: false, message: missingList[0] };
      }

      // Immediately reserve / deduct costs
      const reservedCosts = {};
      for (const [key, req] of Object.entries(spec.costs)) {
        reservedCosts[key] = req;
        if (key === "seeds" || key === "nutrients") {
          state.supplies[key] -= req;
        } else {
          state.res[key] = this.clamp(state.res[key] - req, 0, CONFIG.resources[key].max);
        }
      }

      const queueId = "q_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const label = bedIndex !== null
        ? `${spec.name} (${state.cropBeds[bedIndex].name})`
        : spec.name;

      state.pendingQueue.push({
        queueId,
        actionId,
        label,
        bedIndex,
        reservedCosts,
        expectedOutput: spec.outputText
      });

      return {
        ok: true,
        message: `Queued: ${label}. Costs reserved immediately; output applies after SIMULATE.`
      };
    },

    /* Cancel a pending action and refund all reserved resources & stamina */
    cancelQueuedAction(state, queueId) {
      const idx = state.pendingQueue.findIndex((q) => q.queueId === queueId);
      if (idx === -1) return false;
      const item = state.pendingQueue[idx];

      for (const [key, amt] of Object.entries(item.reservedCosts)) {
        if (key === "seeds" || key === "nutrients") {
          state.supplies[key] += amt;
        } else {
          state.res[key] = this.clamp(state.res[key] + amt, 0, CONFIG.resources[key].max);
        }
      }

      state.pendingQueue.splice(idx, 1);
      return true;
    },

    /* 7-Step End-of-Day Simulation (Days 1–7) */
    simulateEndOfDay(state) {
      const dayNum = state.day;
      const startSnapshot = { ...state.res };
      const producedLog = [];
      const consumedLog = [];
      const maturedCrops = [];
      const warnings = [];

      // STEP 1: Execute Pending Actions (costs were ALREADY deducted when queued!)
      for (const item of state.pendingQueue) {
        if (item.actionId === "recycleWater") {
          state.res.water = this.clamp(state.res.water + 10, 0, CONFIG.resources.water.max);
          producedLog.push("Water Recycling: +10 L Water");
        } else if (item.actionId === "generateOxygen") {
          state.res.oxygen = this.clamp(state.res.oxygen + 4, 0, CONFIG.resources.oxygen.max);
          producedLog.push("Generate Oxygen: +4 kg Oxygen");
        } else if (item.actionId === "repairBase") {
          state.res.integrity = this.clamp(state.res.integrity + 20, 0, CONFIG.resources.integrity.max);
          producedLog.push("Repair Equipment: +20% Base Integrity");
        } else if (item.actionId === "growFood") {
          const bed = state.cropBeds[item.bedIndex];
          if (bed) {
            bed.status = "Growing";
            bed.remainingDays = CONFIG.actions.growFood.cropGrowthDays;
            producedLog.push(`${bed.name}: Seedlings planted (3-day growth timer started)`);
          }
        } else if (item.actionId === "harvestFood") {
          const bed = state.cropBeds[item.bedIndex];
          state.res.food = this.clamp(state.res.food + 15, 0, CONFIG.resources.food.max);
          if (bed) {
            bed.status = "Empty";
            bed.remainingDays = 0;
          }
          producedLog.push(`Harvest Food (${bed ? bed.name : "Greenhouse"}): +15 FP Food`);
        }
      }
      state.pendingQueue = [];

      // STEP 2: Automatic Power System (+25 kWh Solar - 10 kWh Base = +15 kWh net)
      const solar = CONFIG.powerSystem.solarGeneration;
      const baseUse = CONFIG.powerSystem.baseConsumption;
      state.res.power = this.clamp(state.res.power + solar - baseUse, 0, CONFIG.resources.power.max);
      producedLog.push(`Solar Array Generation: +${solar} kWh Power`);
      consumedLog.push(`Habitat Base Systems: -${baseUse} kWh Power`);

      // STEP 3: Crew Consumption (4 Astronauts: Water 15.14 L, Oxygen 3.32 kg, Food 12.14 FP)
      const reqW = CONFIG.dailyCrewConsumption.water;
      const reqO = CONFIG.dailyCrewConsumption.oxygen;
      const reqF = CONFIG.dailyCrewConsumption.food;

      // Water consumption + dehydration consequence check
      if (state.res.water < reqW) {
        const deficit = fmt(reqW - state.res.water);
        state.res.water = 0;
        const pen = CONFIG.depletionPenalties.waterZeroStaminaPenalty;
        state.res.stamina = this.clamp(state.res.stamina - pen, 0, 100);
        warnings.push(`Water Depleted! Short by ${deficit} L — Crew suffered -${pen}% Stamina dehydration penalty.`);
      } else {
        state.res.water = this.clamp(state.res.water - reqW, 0, CONFIG.resources.water.max);
      }
      consumedLog.push(`Crew Water Use (4 Astronauts): -${reqW} L`);

      // Oxygen consumption (lethal if reaches 0)
      state.res.oxygen = this.clamp(state.res.oxygen - reqO, 0, CONFIG.resources.oxygen.max);
      consumedLog.push(`Crew Oxygen Use (4 Astronauts): -${reqO} kg`);

      // Food consumption + starvation consequence check
      if (state.res.food < reqF) {
        const deficit = fmt(reqF - state.res.food);
        state.res.food = 0;
        const pen = CONFIG.depletionPenalties.foodZeroStaminaPenalty;
        state.res.stamina = this.clamp(state.res.stamina - pen, 0, 100);
        warnings.push(`Food Depleted! Short by ${deficit} FP — Crew suffered -${pen}% Stamina hunger penalty.`);
      } else {
        state.res.food = this.clamp(state.res.food - reqF, 0, CONFIG.resources.food.max);
      }
      consumedLog.push(`Crew Food Use (4 Astronauts): -${reqF} FP`);

      // STEP 4: Crop Growth
      for (const bed of state.cropBeds) {
        if (bed.status === "Growing") {
          bed.remainingDays -= 1;
          if (bed.remainingDays <= 0) {
            bed.remainingDays = 0;
            bed.status = "Mature";
            maturedCrops.push(`${bed.name} has reached MATURE status and is ready to harvest!`);
          }
        }
      }

      // STEP 5: Daily Events
      const event = CONFIG.dailyEvents[dayNum] || {
        title: "Quiet Lunar Night",
        description: "Habitat sensors remained nominal overnight.",
        effects: {}
      };
      for (const [k, delta] of Object.entries(event.effects || {})) {
        if (state.res[k] !== undefined) {
          state.res[k] = this.clamp(state.res[k] + delta, 0, CONFIG.resources[k].max);
        }
      }

      // STEP 6: Survival Validation
      let failureReason = null;
      if (state.res.oxygen <= 0) {
        failureReason = "CRITICAL FAILURE: Cabin Oxygen reached 0 kg. Life support could not sustain the crew.";
      } else if (state.res.integrity <= 0) {
        failureReason = "CRITICAL FAILURE: Base Integrity reached 0%. Structural hull breach occurred.";
      } else if (state.res.stamina <= 0) {
        failureReason = "CRITICAL FAILURE: Astronaut Stamina reached 0%. Exhaustion prevented emergency operations.";
      }

      if (!failureReason && state.res.power <= 0) {
        warnings.push("Power Reserve at 0 kWh: Powered machines are offline until solar arrays recharge.");
      }

      // STEP 7: Advance Day or Set Final State
      const isFinalDay = dayNum >= CONFIG.totalDays;
      if (failureReason) {
        state.phase = "gameover";
      } else if (isFinalDay) {
        state.phase = "victory";
      } else {
        state.day = dayNum + 1;
      }

      const report = {
        day: dayNum,
        before: startSnapshot,
        after: { ...state.res },
        producedLog,
        consumedLog,
        maturedCrops,
        event,
        warnings,
        failureReason,
        isFinalDay
      };

      state.lastReport = report;
      return report;
    }
  };


  /* =========================================================================
   * MODULE 4: AudioEngine (Glitch-Free Web Audio SFX, Zero Background Music)
   * ========================================================================= */
  const AudioEngine = (() => {
    let ctx = null;
    let masterGain = null;
    let sfxGain = null;
    let limiter = null;
    const vol = { master: 0.75, sfx: 0.8 };

    function clampGain(v) {
      return Math.max(0.0005, Math.min(1, v));
    }

    function ensureContext() {
      try {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();

          limiter = ctx.createDynamicsCompressor();
          limiter.threshold.value = -12;
          limiter.knee.value = 12;
          limiter.ratio.value = 8;
          limiter.attack.value = 0.003;
          limiter.release.value = 0.1;

          masterGain = ctx.createGain();
          sfxGain = ctx.createGain();

          masterGain.gain.value = vol.master <= 0 ? 0.0005 : clampGain(vol.master);
          sfxGain.gain.value = vol.sfx <= 0 ? 0.0005 : clampGain(vol.sfx);

          sfxGain.connect(masterGain);
          masterGain.connect(limiter);
          limiter.connect(ctx.destination);
        }
        if (ctx.state === "suspended") {
          ctx.resume().catch(() => {});
        }
        return ctx;
      } catch (e) {
        return null;
      }
    }

    function playTone(freq, duration = 0.05, type = "triangle", peak = 0.13, delay = 0) {
      if (vol.master <= 0 || vol.sfx <= 0) return;
      const c = ensureContext();
      if (!c) return;
      try {
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const env = c.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        const safePeak = clampGain(peak);
        env.gain.setValueAtTime(0.0005, now);
        env.gain.linearRampToValueAtTime(safePeak, now + 0.004);
        env.gain.exponentialRampToValueAtTime(0.0005, now + Math.max(0.015, duration));

        osc.connect(env);
        env.connect(sfxGain);

        osc.start(now);
        osc.stop(now + duration + 0.012);
        osc.onended = () => {
          osc.disconnect();
          env.disconnect();
        };
      } catch (e) {}
    }

    return {
      setMaster(v) {
        vol.master = Math.max(0, Math.min(1, v));
        if (masterGain && ctx) {
          masterGain.gain.setTargetAtTime(vol.master <= 0 ? 0.0005 : clampGain(vol.master), ctx.currentTime, 0.01);
        }
      },
      setSfx(v) {
        vol.sfx = Math.max(0, Math.min(1, v));
        if (sfxGain && ctx) {
          sfxGain.gain.setTargetAtTime(vol.sfx <= 0 ? 0.0005 : clampGain(vol.sfx), ctx.currentTime, 0.01);
        }
      },
      getVolumes: () => ({ ...vol }),
      click()    { playTone(560, 0.04, "triangle", 0.12); },
      inspect()  { playTone(440, 0.04, "sine", 0.10, 0); playTone(620, 0.05, "sine", 0.10, 0.035); },
      reserve()  { playTone(480, 0.05, "triangle", 0.13, 0); playTone(720, 0.07, "triangle", 0.14, 0.045); },
      retrieve() { playTone(660, 0.05, "triangle", 0.12, 0); playTone(420, 0.07, "triangle", 0.12, 0.045); },
      warn()     { playTone(210, 0.11, "sawtooth", 0.08, 0); playTone(170, 0.13, "sawtooth", 0.08, 0.10); },
      door()     { playTone(260, 0.08, "sine", 0.13, 0); playTone(390, 0.11, "sine", 0.13, 0.07); },
      step()     { playTone(130, 0.03, "sine", 0.06); },
      type()     { playTone(690, 0.018, "triangle", 0.035); },
      simTick(i) { playTone(320 + (i % 6) * 65, 0.05, "triangle", 0.09); },
      thruster() { playTone(110, 0.14, "sawtooth", 0.06); },
      success()  {
        playTone(440, 0.07, "triangle", 0.13, 0);
        playTone(554, 0.07, "triangle", 0.13, 0.07);
        playTone(659, 0.16, "triangle", 0.15, 0.14);
      }
    };
  })();

      const c = document.createElement("canvas");
      c.width = w;

      return { c, ctx };

      const { c, ctx } = createCanvas(src.width, src.height);

      if (type === "water") {
        px(10, 13, 18, 19, "#181228");

        px(11, 14, 16, 5, "#60c4ff");
        px(36, 13, 18, 19, "#181228");

        px(37, 14, 16, 5, "#60c4ff");

        px(15, by, 2, 2, "#ffffff");
        px(21, by - 3, 2, 2, "#bdf0ff");
        px(42, by - 1, 2, 2, "#ffffff");
        px(47, by + 2, 2, 2, "#bdf0ff");
        px(30, 15, 4, 14, "#181228");
        px(31, 16, 2, 4, "#4fd190");
      } else if (type === "oxygen") {
        px(10, 13, 26, 19, "#181228");
        px(11, 14, 24, 17, "#1e7a56");
        px(13, 16, 20, 13, "#4fd190");

        px(ox, 20, 3, 3, "#ffffff");
        px(ox + 7, 24, 2, 2, "#d6ffeb");
        px(40, 13, 14, 19, "#181228");
        for (let vy = 15; vy <= 28; vy += 4) {
          px(42, vy, 10, 2, frame === 0 ? "#bdf5dc" : "#78c9a5");
        }
      } else if (type === "repair") {
        px(10, 13, 44, 19, "#181228");
        px(11, 14, 42, 17, "#1e293b");
        px(14, 17, 16, 11, "#2563eb");
        px(16, 19, 12, 7, "#93c5fd");
        px(34, 17, 16, 4, frame === 0 ? "#ffd466" : "#f97316");
        px(34, 24, 16, 4, "#4fd190");
      } else if (type === "galley") {
        px(10, 13, 44, 19, "#181228");
        px(11, 14, 42, 17, "#334155");
        px(13, 16, 17, 13, "#e67432");
        px(15, 18, 13, 9, "#fed7aa");
        px(34, 16, 17, 13, "#2788c9");
        px(36, 18, 13, 9, "#bae6fd");
      }

      px(52, 9, 4, 2, frame === 0 ? "#4fd190" : "#ffd466");

  /* =========================================================================
   * MODULE 7: DialogueSystem (Supports Gradual Typing + Interactive Choices)
   * ========================================================================= */
  const DialogueSystem = (() => {
    let active = null;
    const boxEl = document.getElementById("dialogueBox");

    function render() {
      if (!active) return;
      const fullLine = active.lines[active.index] || "";
      const visibleCount = Math.floor(active.charPos);
      const visibleText = fullLine.slice(0, visibleCount);
      const isLineComplete = visibleCount >= fullLine.length;
      const isLastLine = active.index >= active.lines.length - 1;
      const showChoices = isLineComplete && isLastLine && active.choices && active.choices.length > 0;

      const portraitHtml = active.portrait
        ? `<div class="dlg-portrait">${PixelArt.iconImg(active.portrait, 40, 48)}</div>`
        : "";

      const speakerHtml = active.speaker
        ? `<span class="dlg-speaker">${active.speaker}</span>`
        : "";

      let choicesHtml = "";
      if (showChoices) {
        choicesHtml = `<div class="dlg-choices">` +
          active.choices.map((ch, idx) =>
            `<button class="choice-btn ${idx === active.selectedChoice ? "selected" : ""}" data-cidx="${idx}">> ${ch.label}</button>`
          ).join("") +
          `</div>`;
      }

      const hintText = showChoices
        ? "[UP/DOWN] Select  |  [ENTER] Choose"
        : isLineComplete
          ? (!isLastLine ? "[ENTER] Next" : "[ENTER] Continue")
          : "[SPACE] Reveal";

      boxEl.innerHTML = `
        <div class="dlg-layout">
          ${portraitHtml}
          <div class="dlg-body">
            ${speakerHtml}
            <div class="dlg-text">${visibleText}</div>
            ${choicesHtml}
          </div>
        </div>
        <div class="dlg-hint">${hintText}</div>
      `;

      if (showChoices) {
        boxEl.querySelectorAll(".choice-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.getAttribute("data-cidx"));
            selectChoice(idx);
          });
        });
      }
    }

    function selectChoice(idx) {
      if (!active || !active.choices || !active.choices[idx]) return;
      const chosen = active.choices[idx];
      AudioEngine.click();
      close(false);
      if (chosen.onSelect) chosen.onSelect();
    }

    function open({ lines, speaker = "", portrait = null, choices = null, onComplete = null }) {
      active = {
        lines: Array.isArray(lines) && lines.length ? lines : ["..."],
        index: 0,
        charPos: 0,
        lastRenderedChars: -1,
        lastSpokenCharIndex: -1,
        speaker,
        portrait,
        choices,
        selectedChoice: 0,
        onComplete
      };
      boxEl.style.display = "block";
      render();
      active.lastRenderedChars = 0;
    }

    function close(skipped = false) {
      if (!active) return;
      const cb = active.onComplete;
      active = null;
      boxEl.style.display = "none";
      boxEl.innerHTML = "";
      if (cb) cb(skipped);
    }

    function update(dt) {
      if (!active) return;
      const fullLine = active.lines[active.index] || "";
      if (active.charPos < fullLine.length) {
        active.charPos = Math.min(fullLine.length, active.charPos + dt * 46);
        const charIdx = Math.floor(active.charPos);

        if (charIdx > active.lastSpokenCharIndex) {
          for (let i = active.lastSpokenCharIndex + 1; i <= charIdx && i < fullLine.length; i++) {
            if (fullLine[i] !== " " && i % 2 === 0) {
              AudioEngine.type();
              break;
            }
          }
          active.lastSpokenCharIndex = charIdx;
        }

        if (charIdx !== active.lastRenderedChars) {
          active.lastRenderedChars = charIdx;
          render();
        }
      }
    }

    function handleKey(key) {
      if (!active) return false;
      const fullLine = active.lines[active.index] || "";
      const isLineComplete = Math.floor(active.charPos) >= fullLine.length;
      const isLastLine = active.index >= active.lines.length - 1;
      const hasChoices = isLineComplete && isLastLine && active.choices && active.choices.length > 0;

      if (hasChoices) {
        if (key === "ArrowUp") {
          active.selectedChoice = (active.selectedChoice - 1 + active.choices.length) % active.choices.length;
          AudioEngine.click();
          render();
          return true;
        }
        if (key === "ArrowDown") {
          active.selectedChoice = (active.selectedChoice + 1) % active.choices.length;
          AudioEngine.click();
          render();
          return true;
        }
        if (key === "Enter" || key === " ") {
          selectChoice(active.selectedChoice);
          return true;
        }
        return true;
      }

      if (key === " ") {
        if (!isLineComplete) {
          active.charPos = fullLine.length;
          active.lastRenderedChars = fullLine.length;
          render();
        }
        return true;
      }

      if (key === "Enter") {
        if (!isLineComplete) {
          active.charPos = fullLine.length;
          active.lastRenderedChars = fullLine.length;
          render();
        } else if (!isLastLine) {
          active.index += 1;
          active.charPos = 0;
          active.lastRenderedChars = 0;
          active.lastSpokenCharIndex = -1;
          AudioEngine.click();
          render();
        } else {
          AudioEngine.click();
          close(false);
        }
        return true;
      }

      return true;
    }

    return {
      open,
      close,
      update,
      handleKey,
      isActive: () => active !== null
    };
  })();

  /* =========================================================================
   * MODULE 9: Renderer
   * Renders:
   * - Main Menu Lunar Habitat Vista
   * - Sleep Transition & Animated Lunar Approach / Touchdown Cutscene
   * - Playable Rooms (Classroom, Bedroom, Spacecraft, Lunar Base Hub & 4 Wings)
   * - Casual Kid & Spacesuit Astronaut 4-direction animated sprites
   * ========================================================================= */
  const Renderer = (() => {
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    const STARS = Array.from({ length: 82 }, (_, i) => ({
      x: (i * 73 + 19) % 480,
      y: (i * 41 + 11) % 215,
      size: i % 7 === 0 ? 2 : 1,
      phase: i * 0.7
    }));

    function drawStarfieldAndEarth(timeMs) {
      ctx.fillStyle = "#090b18";
      ctx.fillRect(0, 0, 480, 320);

      for (const st of STARS) {
        const alpha = 0.45 + 0.55 * Math.sin(timeMs / 460 + st.phase);
        ctx.fillStyle = `rgba(255, 250, 235, ${alpha.toFixed(2)})`;
        ctx.fillRect(st.x, st.y, st.size, st.size);
      }

      // Crescent Earth
      const ex = 88, ey = 68;
      ctx.fillStyle = "#162244";
      ctx.beginPath();
      ctx.arc(ex, ey, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.arc(ex - 3, ey - 2, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#162244";
      ctx.beginPath();
      ctx.arc(ex + 6, ey + 4, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#4fd190";
      ctx.fillRect(ex - 16, ey - 8, 6, 5);
      ctx.fillRect(ex - 14, ey + 2, 5, 6);
      ctx.fillStyle = "#e0f2fe";
      ctx.fillRect(ex - 18, ey - 3, 9, 2);
    }

    function drawLunarSurface() {
      ctx.fillStyle = "#3c435c";
      ctx.beginPath();
      ctx.moveTo(0, 232);
      ctx.lineTo(65, 208);
      ctx.lineTo(135, 222);
      ctx.lineTo(220, 198);
      ctx.lineTo(310, 218);
      ctx.lineTo(395, 202);
      ctx.lineTo(480, 224);
      ctx.lineTo(480, 250);
      ctx.lineTo(0, 250);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#7a8299";
      ctx.fillRect(0, 235, 480, 85);
      ctx.fillStyle = "#919ab3";
      ctx.fillRect(0, 235, 480, 6);

      const drawCrater = (cx, cy, rx, ry) => {
        ctx.fillStyle = "#5a6178";
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#a3acc4";
        ctx.fillRect(cx - rx + 3, cy + ry - 1, rx * 2 - 6, 2);
      };
      drawCrater(68, 272, 24, 7);
      drawCrater(412, 280, 28, 8);
      drawCrater(165, 298, 16, 5);
      drawCrater(325, 296, 18, 5);
    }

    function drawMenuLunarBase(timeMs) {
      drawStarfieldAndEarth(timeMs);
      drawLunarSurface();

      const hx = 240, hy = 252;
      // Solar wings
      ctx.fillStyle = "#181228";
      ctx.fillRect(hx - 128, hy - 26, 58, 18);
      ctx.fillRect(hx + 70, hy - 26, 58, 18);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(hx - 126, hy - 24, 54, 14);
      ctx.fillRect(hx + 72, hy - 24, 54, 14);
      ctx.fillStyle = "#93c5fd";
      for (let gx = 0; gx < 54; gx += 13) {
        ctx.fillRect(hx - 126 + gx, hy - 24, 1, 14);
        ctx.fillRect(hx + 72 + gx, hy - 24, 1, 14);
      }

      // Geodesic Lunar Dome
      ctx.fillStyle = "#181228";
      ctx.beginPath();
      ctx.arc(hx, hy - 12, 56, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#e2e8f0";
      ctx.beginPath();
      ctx.arc(hx, hy - 12, 53, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "#94a3b8";
      ctx.fillRect(hx - 54, hy - 16, 108, 16);
      ctx.fillStyle = "#181228";
      ctx.fillRect(hx - 56, hy, 112, 3);

      // Windows
      const drawWin = (wx, wy) => {
        ctx.fillStyle = "#181228";
        ctx.fillRect(wx - 1, wy - 1, 14, 11);
        ctx.fillStyle = "#ffd466";
        ctx.fillRect(wx, wy, 12, 9);
      };
      drawWin(hx - 38, hy - 28);
      drawWin(hx - 16, hy - 28);
      drawWin(hx + 6,  hy - 28);
      drawWin(hx + 28, hy - 28);

      // Standing Astronaut on the lunar regolith next to the habitat!
      ctx.drawImage(PixelArt.sprites.suit_down_idle, hx + 76, hy - 18, 22, 32);
    }

    /* Animated Lunar Approach & Touchdown Cutscene (End of Day 0 -> Day 1) */
    function drawLandingCutscene(progress, timeMs) {
      drawStarfieldAndEarth(timeMs);
      drawLunarSurface();

      // Landing pad markers
      ctx.fillStyle = "#334155";
      ctx.fillRect(190, 240, 100, 8);
      ctx.fillStyle = "#ffd466";
      ctx.fillRect(196, 242, 12, 3);
      ctx.fillRect(272, 242, 12, 3);

      // Spacecraft descends smoothly from y=34 to y=214
      const eased = 1 - Math.pow(1 - Math.min(1, progress / 0.78), 2);
      const landerY = Math.round(34 + eased * 180);
      const lx = 240;

      // Descent thruster flame while descending
      if (progress < 0.78) {
        const flicker = (Math.floor(timeMs / 60) % 2) * 5;
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(lx - 12, landerY + 26);
        ctx.lineTo(lx + 12, landerY + 26);
        ctx.lineTo(lx, landerY + 46 + flicker);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.moveTo(lx - 6, landerY + 26);
        ctx.lineTo(lx + 6, landerY + 26);
        ctx.lineTo(lx, landerY + 37 + flicker);
        ctx.closePath();
        ctx.fill();
      } else {
        // Touchdown regolith dust puffs
        const puff = Math.min(26, (progress - 0.78) * 110);
        ctx.fillStyle = "rgba(203, 213, 225, 0.55)";
        ctx.fillRect(lx - 34 - puff, 234, 16, 6);
        ctx.fillRect(lx + 18 + puff, 234, 16, 6);
      }

      // Landing struts
      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(lx - 26, landerY + 14, 4, 14);
      ctx.fillRect(lx + 22, landerY + 14, 4, 14);
      ctx.fillRect(lx - 30, landerY + 26, 10, 3);
      ctx.fillRect(lx + 20, landerY + 26, 10, 3);

      // ASTRA Lunar Lander Hull
      ctx.fillStyle = "#181228";
      ctx.fillRect(lx - 22, landerY - 14, 44, 32);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(lx - 20, landerY - 12, 40, 28);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(lx - 20, landerY + 6, 40, 6);
      ctx.fillStyle = "#f97316";
      ctx.fillRect(lx - 14, landerY - 6, 28, 8);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(lx - 8, landerY - 4, 16, 4);

      // Banner text
      ctx.fillStyle = "rgba(9, 11, 24, 0.82)";
      ctx.fillRect(70, 18, 340, 34);
      ctx.strokeStyle = "#ffd466";
      ctx.lineWidth = 2;
      ctx.strokeRect(70, 18, 340, 34);

      ctx.fillStyle = "#ffd466";
      ctx.font = "9px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      if (progress < 0.78) {
        ctx.fillText("LUNAR DESCENT IN PROGRESS...", 240, 39);
      } else {
        ctx.fillStyle = "#4fd190";
        ctx.fillText("DAY 1 — LUNAR MISSION BEGINS", 240, 39);
      }
    }

    function drawSleepCutscene(progress, timeMs) {
      ctx.fillStyle = "#090b18";
      ctx.fillRect(0, 0, 480, 320);
      const bob = Math.sin(timeMs / 260) * 3;
      ctx.fillStyle = "#ffd466";
      ctx.font = "11px 'Press Start 2P', monospace";
      ctx.textAlign = "center";
      ctx.fillText("z  z  Z ...", 240, 148 + bob);
      ctx.fillStyle = "#93c5fd";
      ctx.font = "8px 'Press Start 2P', monospace";
      ctx.fillText("Drifting off to sleep...", 240, 174);
    }

    function drawRoom(state, nearObj, walkFrameIndex, timeMs) {
      const room = RoomDefinitions[state.room];
      const { x1, y1, x2, y2 } = room.bounds;
      const roomW = x2 - x1;
      const roomH = y2 - y1;

      ctx.fillStyle = "#090b18";
      ctx.fillRect(0, 0, 480, 320);

      // Station / Room Walls
      ctx.fillStyle = room.wallTrim;
      ctx.fillRect(x1 - 12, y1 - 22, roomW + 24, roomH + 34);
      ctx.fillStyle = room.wallTop;
      ctx.fillRect(x1 - 8, y1 - 18, roomW + 16, 18);

      ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
      for (let rx = x1 + 4; rx < x2 - 4; rx += 32) {
        ctx.fillRect(rx, y1 - 16, 28, 2);
      }

      ctx.fillStyle = "#f8f5ec";
      ctx.font = "7px 'Press Start 2P', monospace";
      ctx.textAlign = "left";
      ctx.fillText(room.name.toUpperCase(), x1, y1 - 6);

      // Paneled Composite Floor Tiles (Non-brown!)
      for (let ty = y1; ty < y2; ty += 16) {
        for (let tx = x1; tx < x2; tx += 16) {
          const checker = ((Math.floor((tx - x1) / 16) + Math.floor((ty - y1) / 16)) & 1);
          const drawW = Math.min(16, x2 - tx);
          const drawH = Math.min(16, y2 - ty);
          ctx.fillStyle = checker ? room.floorB : room.floorA;
          ctx.fillRect(tx, ty, drawW, drawH);

          ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
          ctx.fillRect(tx, ty, drawW, 1);
          ctx.fillRect(tx, ty, 1, drawH);
        }
      }

      if (room.hasHazardTrim) {
        for (let hx = x1; hx < x2 - 6; hx += 12) {
          ctx.fillStyle = "#181228";
          ctx.fillRect(hx, y1, 6, 3);
          ctx.fillStyle = "#f2c230";
          ctx.fillRect(hx + 6, y1, 6, 3);
        }
      }

      if (room.hasCenterMat) {
        const mx = 200, my = 152, mw = 80, mh = 42;
        ctx.fillStyle = "rgba(59, 53, 92, 0.16)";
        ctx.fillRect(mx, my, mw, mh);
        ctx.strokeStyle = "rgba(59, 53, 92, 0.36)";
        ctx.lineWidth = 1;
        ctx.strokeRect(mx + 2, my + 2, mw - 4, mh - 4);
      }

      ctx.strokeStyle = "#181228";
      ctx.lineWidth = 2;
      ctx.strokeRect(x1 - 1, y1 - 1, roomW + 2, roomH + 2);

      // Doors
      for (const door of room.doors) {
        ctx.fillStyle = "#181228";
        ctx.fillRect(door.x, door.y, door.w, door.h);
        ctx.fillStyle = "#2d2747";
        ctx.fillRect(door.x + 2, door.y + 2, door.w - 4, door.h - 4);

        ctx.fillStyle = door.color;
        const stripY = door.y < y1 ? door.y + door.h - 4 : door.y + 2;
        ctx.fillRect(door.x + 4, stripY, door.w - 8, 3);

        ctx.fillStyle = "#ffffff";
        ctx.font = "5px 'Press Start 2P', monospace";
        ctx.textAlign = "center";
        ctx.fillText(door.label, door.x + door.w / 2, door.y + 12);
      }

      // Y-Sorted Objects & Player
      const animFrame = Math.floor(timeMs / 420) % 2;
      const list = [];

      for (const obj of room.objects) {
        list.push({
          sortY: obj.y + obj.h,
          draw: () => {
            ctx.fillStyle = "rgba(24, 18, 40, 0.22)";
            ctx.fillRect(obj.x + 2, obj.y + obj.h - 2, obj.w - 4, 4);

            let spr = PixelArt.sprites[obj.sprite];
            if (obj.kind === "grow_bed") {
              const bed = state.cropBeds[obj.bedIndex];
              const st = bed ? bed.status : "Empty";
              spr = PixelArt.sprites[`bed_${st}_${animFrame}`];
            } else if (obj.sprite && PixelArt.sprites[`${obj.sprite}_${animFrame}`]) {
              spr = PixelArt.sprites[`${obj.sprite}_${animFrame}`];
            }

            if (spr) {
              ctx.drawImage(spr, obj.x, obj.y, obj.w, obj.h);
            }

            // Status badge above Greenhouse Grow Beds
            if (obj.kind === "grow_bed") {
              const bed = state.cropBeds[obj.bedIndex];
              if (bed) {
                ctx.fillStyle = "#181228";
                ctx.fillRect(obj.x + 3, obj.y - 11, obj.w - 6, 9);
                ctx.fillStyle = bed.status === "Mature" ? "#4fd190" : bed.status === "Growing" ? "#ffd466" : "#cbd5e1";
                ctx.font = "5px 'Press Start 2P', monospace";
                ctx.textAlign = "center";
                const tag = bed.status === "Growing" ? `${bed.remainingDays}D LEFT` : bed.status.toUpperCase();
                ctx.fillText(tag, obj.x + obj.w / 2, obj.y - 4);
              }
            }

            // Bobbing indicator ONLY above the single nearest interactive object
            if (nearObj && nearObj.id === obj.id) {
              const bob = Math.round(Math.sin(timeMs / 170) * 1.5);
              const ix = Math.round(obj.x + obj.w / 2 - 4);
              const iy = obj.y - (obj.kind === "grow_bed" ? 20 : 9) + bob;
              ctx.fillStyle = "#181228";
              ctx.fillRect(ix, iy, 8, 6);
              ctx.fillStyle = "#ffd466";
              ctx.fillRect(ix + 1, iy + 1, 6, 4);
              ctx.fillStyle = "#181228";
              ctx.fillRect(ix + 3, iy + 6, 2, 2);
            }
          }
        });
      }

      list.push({
        sortY: state.y,
        draw: () => drawPlayer(state, walkFrameIndex)
      });

      list.sort((a, b) => a.sortY - b.sortY);
      for (const item of list) {
        item.draw();
      }
    }

    function drawPlayer(state, walkFrameIndex) {
      const px = Math.round(state.x);
      const py = Math.round(state.y);

      ctx.fillStyle = "rgba(24, 18, 40, 0.32)";
      ctx.beginPath();
      ctx.ellipse(px, py - 1, 7, 2.5, 0, 0, Math.PI * 2);
      ctx.fill();

      const suffix = walkFrameIndex === 1 ? "walk1" : walkFrameIndex === 3 ? "walk2" : "idle";
      if (state.outfit === "suit") {
        // Full Astronaut Spacesuit (18x26)
        const spr = PixelArt.sprites[`suit_${state.facing}_${suffix}`] || PixelArt.sprites.suit_down_idle;
        ctx.drawImage(spr, px - 9, py - 25, 18, 26);
      } else {
        // Casual Kid Clothes (16x24)
        const spr = PixelArt.sprites[`kid_${state.facing}_${suffix}`] || PixelArt.sprites.kid_down_idle;
        ctx.drawImage(spr, px - 8, py - 23, 16, 24);
      }
    }

    function drawFadeOverlay(alpha) {
      ctx.fillStyle = `rgba(8, 10, 20, ${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
      ctx.fillRect(0, 0, 480, 320);
    }

    return {
      drawMenuLunarBase,
      drawLandingCutscene,
      drawSleepCutscene,
      drawRoom,
      drawFadeOverlay
    };
  })();


  /* =========================================================================
   * MODULE 10: UIManager
   * Handles HUD, Objective Bar, Machine Tutorials, Action Interfaces (Water,
   * Oxygen, Repair, Greenhouse Grow/Harvest, Galley Eat/Drink), Pending Queue
   * with Cancel/Refund, End-of-Day Simulation, Daily Reports, and Menus.
   * ========================================================================= */
  const UIManager = (() => {
    const hudEl = document.getElementById("hud");
    const objBarEl = document.getElementById("objectiveBar");
    const toastEl = document.getElementById("toast");
    const promptEl = document.getElementById("prompt");
    const modalLayer = document.getElementById("modalLayer");

    let modalOpen = false;
    let simBusy = false;
    let toastTimer = null;

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.style.display = "none";
      }, 2500);
    }

    function setPrompt(text, onClickFn = null) {
      if (text) {
        promptEl.textContent = text;
        promptEl.style.display = "block";
        promptEl.onclick = onClickFn;
      } else {
        promptEl.style.display = "none";
        promptEl.onclick = null;
      }
    }

    function openModal(html, overlayClass = "") {
      modalOpen = true;
      modalLayer.style.display = "block";
      modalLayer.innerHTML = `<div class="overlay ${overlayClass}">${html}</div>`;
    }

    function closeModal() {
      modalOpen = false;
      modalLayer.style.display = "none";
      modalLayer.innerHTML = "";
      updateHUD();
    }

    function bindBtn(id, fn) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("click", () => {
          AudioEngine.click();
          fn();
        });
      }
    }

    function updateHUD() {
      const mode = GameController.getMode();
      const s = GameState.get();

      if (mode !== "play" || s.phase === "story_classroom" || s.phase === "story_bedroom") {
        hudEl.style.display = "none";
        if (mode === "play" && (s.phase === "story_classroom" || s.phase === "story_bedroom")) {
          objBarEl.style.display = "flex";
          objBarEl.style.top = "0px";
          objBarEl.innerHTML = s.phase === "story_classroom"
            ? `<span>OBJECTIVE: Listen to Mr. Okafor's lesson, then walk to the [GO HOME] door.</span>`
            : `<span>OBJECTIVE: Approach your bed and select [ SLEEP ].</span>`;
        } else {
          objBarEl.style.display = "none";
        }
        return;
      }

      hudEl.style.display = "flex";
      objBarEl.style.display = "flex";
      objBarEl.style.top = "54px";

      const keysOrder = ["water", "oxygen", "food", "power", "integrity", "stamina"];
      let html = "";
      for (const k of keysOrder) {
        const meta = CONFIG.resources[k];
        const val = s.res[k];
        const pct = Math.max(0, Math.min(100, (val / meta.max) * 100));
        const isWarn =
          (k === "oxygen" && val <= 8) ||
          (k === "integrity" && val <= 25) ||
          (k === "stamina" && val <= 20) ||
          (k === "water" && val <= 16) ||
          (k === "food" && val <= 14);

        html += `
          <div class="hud-cell ${isWarn ? "hud-warn" : ""}">
            <div class="hud-top">
              <span class="hud-label">${PixelArt.iconImg(k, 12, 12)} ${meta.name === "Base Integrity" ? "Integrity" : meta.name}</span>
              <span class="hud-vals">${fmt(val)}/${meta.max}${meta.unit}</span>
            </div>
            <div class="hud-bar"><i style="width:${pct}%;background:${meta.color}"></i></div>
          </div>
        `;
      }

      if (s.phase === "day0") {
        html += `<div class="hud-day">DAY 0<br>TUTORIAL</div>`;
        html += `<div class="hud-actions"><button class="hud-btn" id="hud_pause">MENU</button></div>`;
      } else {
        html += `<div class="hud-day">DAY ${s.day} / ${CONFIG.totalDays}</div>`;
        html += `
          <div class="hud-actions">
            <button class="hud-btn" id="hud_queue">QUEUE (${s.pendingQueue.length})</button>
            <button class="hud-btn sim" id="hud_sim">END DAY</button>
          </div>
        `;
      }

      hudEl.innerHTML = html;

      if (s.phase === "day0") {
        const ready = GameLogicService.isDay0Complete(s);
        const crewCount = [s.storyFlags.talkedNova, s.storyFlags.talkedEngineer, s.storyFlags.talkedScientist].filter(Boolean).length;
        const machCount = Object.keys(s.storyFlags.inspectedMachines || {}).length;
        objBarEl.innerHTML = ready
          ? `<span style="color:#4fd190;">MISSION READY — DAY 0 COMPLETE!</span> <button class="hud-btn sim" id="obj_timeskip">[ TIME SKIP ]</button>`
          : `<span>DAY 0 TUTORIAL (No Consumption) — Crew Talked: ${crewCount}/3 | Machines Inspected: ${machCount}/5</span>`;
        bindBtn("hud_pause", openPauseMenu);
        bindBtn("obj_timeskip", () => StoryManager.triggerTimeSkipLanding());
      } else {
        const powerWarn = s.res.power <= 0 ? `<span style="color:#ff5e5e;">POWER 0 kWh (Machines Offline)</span>` : `<span>Solar: +25 kWh | Base: -10 kWh | Crew: -15.14L W, -3.32kg O2, -12.14FP Food</span>`;
        objBarEl.innerHTML = `${powerWarn} <span>Queued Actions: <b>${s.pendingQueue.length}</b></span>`;
        bindBtn("hud_queue", openPendingQueueModal);
        bindBtn("hud_sim", openEndDayConsole);
      }
    }

    /* ----- SHARED MACHINE ACTION MODAL (Water, Oxygen, Repair) ----- */
    function openQueuedMachinePanel(actionId, feedbackMsg = "", isError = false) {
      const s = GameState.get();
      const spec = CONFIG.actions[actionId];
      const powerOffline = spec.requiresPower && s.res.power <= 0;
      const queuedCount = s.pendingQueue.filter((q) => q.actionId === actionId).length;

      const costBadges = Object.entries(spec.costs).map(([k, req]) => {
        const meta = CONFIG.resources[k];
        return `<span class="cost-tag">${PixelArt.iconImg(k, 13, 13)} -${fmt(req)} ${meta.unit} ${meta.name}</span>`;
      }).join("");

      const iconMap = {
        recycleWater: "mach_water",
        generateOxygen: "mach_oxygen",
        repairBase: "mach_repair"
      };

      openModal(`
        <div class="window">
          <div class="win-header">
            <h2 class="win-title">
              ${PixelArt.iconImg(iconMap[actionId], 32, 22)}
              <span>${spec.machineName}</span>
            </h2>
            <span class="status-pill ${powerOffline ? "offline" : "ready"}">
              ${powerOffline ? "OFFLINE (0 kWh)" : `OPERATIONAL (QUEUED: ${queuedCount})`}
            </span>
          </div>

          <p style="font-size:9.5px;margin:0 0 10px 0;">${spec.description}</p>

          <div class="grid-2">
            <div class="panel-box">
              <h3>Required Costs (Reserved Immediately)</h3>
              <div class="cost-row">${costBadges}</div>
              <p style="font-size:8.5px;color:var(--ink-muted);margin-top:8px;">
                Costs are deducted immediately upon clicking CONFIRM and refunded if cancelled before simulation.
              </p>
            </div>
            <div class="panel-box">
              <h3>Expected Output (After SIMULATE)</h3>
              <div class="cost-row">
                <span class="cost-tag out">${spec.outputText}</span>
              </div>

    function openWaterPanel()  { openQueuedMachinePanel("recycleWater"); }
    function openOxygenPanel() { openQueuedMachinePanel("generateOxygen"); }
    function openRepairPanel() { openQueuedMachinePanel("repairBase"); }

    function runSimulationSequence() {
      if (simBusy) return;
      simBusy = true;
      const s = GameState.get();

      openModal(`
        <div class="window narrow" style="text-align:center;">
          <h2 style="font-size:13px;margin:0 0 8px 0;">Simulating Day ${s.day}...</h2>
          <p style="font-size:9px;color:var(--ink-muted);">Executing queued operations & overnight survival cycle</p>
          <div class="sim-progress"><i id="simBar"></i></div>
          <p id="simStepTxt" style="font-size:9px;">Step 1: Executing pending machine outputs...</p>
        </div>
      `);

      const labels = [
        "Step 1: Executing pending machine outputs...",
        "Step 2: Calculating solar generation (+25 kWh) & base load (-10 kWh)...",
        "Step 3: Applying 4-astronaut daily consumption...",
        "Step 4–6: Updating crop timers, lunar events & survival checks..."
      ];

      let tick = 0;
      const iv = setInterval(() => {
        tick += 1;
        const bar = document.getElementById("simBar");
        const txt = document.getElementById("simStepTxt");
        if (bar) bar.style.width = `${Math.min(100, tick * 10)}%`;
        if (txt) txt.textContent = labels[Math.min(labels.length - 1, Math.floor(tick / 3))];
        AudioEngine.simTick(tick);

        if (tick >= 10) {
          clearInterval(iv);
          const report = GameLogicService.simulateEndOfDay(s);
          simBusy = false;
          if (!report.failureReason) {
            GameState.save();
            AudioEngine.success();
          } else {
            AudioEngine.warn();
          }
          openDailyReportModal(report);
        }
      }, 110);
    }

        return `
          <div style="display:flex;justify-content:space-between;font-size:9px;padding:3px 0;border-bottom:1px solid var(--border-light);">
            <span>${PixelArt.iconImg(k, 12, 12)} ${meta.name}</span>
