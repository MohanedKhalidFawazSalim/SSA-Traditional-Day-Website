  /* =========================================================================
   * MODULE 11: GameController
   * Manages game loop, movement, collisions, room transitions, sleep fade,
   * and lunar landing cutscene.
   * ========================================================================= */
  const GameController = (() => {
    let mode = "menu"; // "menu" | "play" | "sleep_cutscene" | "landing_cutscene" | "ending"
    const keys = {};
    let nearObject = null;

    let fadePhase = "none"; // "none" | "out" | "in"
    let fadeAlpha = 0;
    let fadeMidCb = null;
    let fadeEndCb = null;
    let doorCooldown = 0;

    let cutsceneTimer = 0;
    let cutsceneDuration = 3.2;
    let cutsceneDoneCb = null;

    let walkAnimClock = 0;
    let walkFrameIndex = 0;
    let lastStepContactFrame = -1;

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getFootbox(x, y) {
      return { x: x - 5, y: y - 5, w: 10, h: 6 };
    }

    function isBlocked(x, y) {
      const s = GameState.get();
      const room = RoomDefinitions[s.room];
      const foot = getFootbox(x, y);
      const { x1, y1, x2, y2 } = room.bounds;

      const insideBounds =
        foot.x >= x1 &&
        foot.y >= y1 &&
        foot.x + foot.w <= x2 &&
        foot.y + foot.h <= y2;

      if (!insideBounds) {
        const onDoor = room.doors.some((d) => rectsOverlap(foot, d));
        if (!onDoor) return true;
      }

      for (const obj of room.objects) {
        const solid = {
          x: obj.x + 2,
          y: obj.y + Math.floor(obj.h * 0.45),
          w: obj.w - 4,
          h: Math.ceil(obj.h * 0.55)
        };
        if (rectsOverlap(foot, solid)) return true;
      }
      return false;
    }

    function startTransition(onMid, onComplete = null) {
      fadePhase = "out";
      fadeAlpha = 0;
      fadeMidCb = onMid;
      fadeEndCb = onComplete;
    }

    function startSleepCutscene(onComplete) {
      mode = "sleep_cutscene";
      cutsceneTimer = 0;
      cutsceneDuration = 2.0;
      cutsceneDoneCb = onComplete;
      UIManager.setPrompt("");
      UIManager.updateHUD();
    }

    function startLandingCutscene(onComplete) {
      mode = "landing_cutscene";
      cutsceneTimer = 0;
      cutsceneDuration = 3.4;
      cutsceneDoneCb = onComplete;
      UIManager.setPrompt("");
      UIManager.updateHUD();
    }

    function bindInput() {
      window.addEventListener("keydown", (e) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
          e.preventDefault();
        }
        keys[e.key] = true;
        if (e.repeat) return;

        if (DialogueSystem.isActive()) {
          DialogueSystem.handleKey(e.key);
          return;
        }

        if (e.key === "Escape" && mode === "play") {
          if (UIManager.isModalOpen()) {
            if (!UIManager.isSimBusy()) {
              AudioEngine.click();
              UIManager.closeModal();
            }
          } else {
            AudioEngine.click();
            UIManager.openPauseMenu();
          }
          return;
        }

        if (e.key === "Enter" && mode === "play" && !UIManager.isModalOpen() && fadePhase === "none" && nearObject) {
          if (nearObject.onInteract) nearObject.onInteract();
        }
      });

      window.addEventListener("keyup", (e) => delete keys[e.key]);
      window.addEventListener("blur", () => {
        for (const k of Object.keys(keys)) delete keys[k];
      });
    }

    let lastTime = 0;

    function loop(timestamp) {
      const dt = Math.min(0.05, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;

      if (doorCooldown > 0) {
        doorCooldown = Math.max(0, doorCooldown - dt);
      }

      if (mode === "menu" || mode === "ending") {
        Renderer.drawMenuLunarBase(timestamp);
      } else if (mode === "sleep_cutscene") {
        cutsceneTimer += dt;
        Renderer.drawSleepCutscene(cutsceneTimer / cutsceneDuration, timestamp);
        if (cutsceneTimer >= cutsceneDuration) {
          mode = "play";
          const cb = cutsceneDoneCb;
          cutsceneDoneCb = null;
          if (cb) cb();
        }
      } else if (mode === "landing_cutscene") {
        cutsceneTimer += dt;
        if (cutsceneTimer < cutsceneDuration * 0.75 && Math.floor(cutsceneTimer * 6) !== Math.floor((cutsceneTimer - dt) * 6)) {
          AudioEngine.thruster();
        }
        Renderer.drawLandingCutscene(cutsceneTimer / cutsceneDuration, timestamp);
        if (cutsceneTimer >= cutsceneDuration) {
          mode = "play";
          const cb = cutsceneDoneCb;
          cutsceneDoneCb = null;
          if (cb) cb();
        }
      } else if (mode === "play") {
        const s = GameState.get();
        const canControl = !UIManager.isModalOpen() && !DialogueSystem.isActive() && fadePhase === "none";

        if (canControl) {
          const dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
          const dy = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);

          if (dx !== 0 || dy !== 0) {
            if (Math.abs(dx) >= Math.abs(dy)) {
              s.facing = dx > 0 ? "right" : "left";
            } else {
              s.facing = dy > 0 ? "down" : "up";
            }

            const diag = dx !== 0 && dy !== 0 ? 0.7071 : 1;
            const speed = 84 * dt * diag;

            if (!isBlocked(s.x + dx * speed, s.y)) s.x += dx * speed;
            if (!isBlocked(s.x, s.y + dy * speed)) s.y += dy * speed;

            walkAnimClock += dt * 9.5;
            walkFrameIndex = Math.floor(walkAnimClock) % 4;
            if ((walkFrameIndex === 1 || walkFrameIndex === 3) && walkFrameIndex !== lastStepContactFrame) {
              lastStepContactFrame = walkFrameIndex;
              AudioEngine.step();
            } else if (walkFrameIndex === 0 || walkFrameIndex === 2) {
              lastStepContactFrame = -1;
            }

            if (doorCooldown <= 0) {
              const foot = getFootbox(s.x, s.y);
              const door = RoomDefinitions[s.room].doors.find((d) => rectsOverlap(foot, d));
              if (door) {
                if (door.action === "go_home") {
                  doorCooldown = 0.6;
                  StoryManager.goHomeFromClassroom();
                } else if (door.to) {
                  AudioEngine.door();
                  startTransition(() => {
                    s.room = door.to;
                    s.x = door.spawnX;
                    s.y = door.spawnY;
                    s.facing = door.dir || "down";
                    doorCooldown = 0.35;
                  });
                }
              }
            }
          } else {
            walkAnimClock = 0;
            walkFrameIndex = 0;
            lastStepContactFrame = -1;
          }
        } else {
          walkFrameIndex = 0;
        }

        // Detect single nearest interactive object
        nearObject = null;
        if (canControl) {
          const room = RoomDefinitions[s.room];
          const foot = getFootbox(s.x, s.y);
          let bestDist = Infinity;

          for (const obj of room.objects) {
            const reach = { x: obj.x - 11, y: obj.y - 11, w: obj.w + 22, h: obj.h + 22 };
            if (rectsOverlap(foot, reach)) {
              const dist = Math.hypot(s.x - (obj.x + obj.w / 2), s.y - (obj.y + obj.h / 2));
              if (dist < bestDist) {
                bestDist = dist;
                nearObject = obj;
              }
            }
          }
        }

        if (nearObject && canControl) {
          const label = nearObject.kind === "sleep_bed"
            ? "[ SLEEP ]"
            : `[ENTER] ${nearObject.name}`;
          UIManager.setPrompt(label, () => {
            if (nearObject && nearObject.onInteract) nearObject.onInteract();
          });
        } else {
          UIManager.setPrompt("");
        }

        Renderer.drawRoom(s, nearObject, walkFrameIndex, timestamp);
      }

      DialogueSystem.update(dt);

      if (fadePhase === "out") {
        fadeAlpha = Math.min(1, fadeAlpha + dt * 4.5);
        Renderer.drawFadeOverlay(fadeAlpha);
        if (fadeAlpha >= 1) {
          if (fadeMidCb) {
            fadeMidCb();
            fadeMidCb = null;
          }
          fadePhase = "in";
        }
      } else if (fadePhase === "in") {
        fadeAlpha = Math.max(0, fadeAlpha - dt * 4.5);
        Renderer.drawFadeOverlay(fadeAlpha);
        if (fadeAlpha <= 0) {
          fadePhase = "none";
          if (fadeEndCb) {
            const cb = fadeEndCb;
            fadeEndCb = null;
            cb();
          }
        }
      }

      requestAnimationFrame(loop);
    }

    function fitViewport() {
      const stage = document.getElementById("stage");
      const scale = Math.min(window.innerWidth / 960, window.innerHeight / 640);
      stage.style.transform = `scale(${Math.max(0.4, scale).toFixed(4)})`;
    }

    function start() {
      PixelArt.init();
      bindInput();
      fitViewport();
      window.addEventListener("resize", fitViewport);
      UIManager.openMainMenu();
      requestAnimationFrame(loop);
    }

    return {
      start,
      getMode: () => mode,
      setMode: (m) => { mode = m; },
      startTransition,
      startSleepCutscene,
      startLandingCutscene
    };
  })();

  window.addEventListener("DOMContentLoaded", () => {
    GameController.start();
  });
  </script>
</body>
</html>
