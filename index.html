<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Day</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5ef;
            color: #333;
        }

        header {
            background: #6b3e26;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        header p {
            font-size: 1.2rem;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        section {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #6b3e26;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            background: #6b3e26;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Traditional Day</h1>
        <p>Celebrating culture, heritage, and traditions</p>
    </header>

    <main>
        <section>
            <h2>Welcome!</h2>
            <p>Welcome to our Traditional Day website.
               Stay tuned for information, activities, and memories!</p>
        </section>

        <section>
            <h2>About the Event</h2>
            <p>More information about our Traditional Day will be added here.</p>
        </section>
    </main>

    <footer>
        <p>Traditional Day © 2026</p>
    </footer>

</body>
</html>
